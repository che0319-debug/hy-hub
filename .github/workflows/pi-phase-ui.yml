name: PI Phase UI acceptance
on:
  pull_request:
    paths:
      - 'src/pages/ExpertTeam.jsx'
      - 'src/pages/expert-team.css'
      - 'src/pages/SystemArchitecture.jsx'
      - 'tests/pi-ui-smoke.cjs'
      - '.github/workflows/pi-phase-ui.yml'
jobs:
  pi-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile and desktop PI workflows
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/pi-vite.log 2>&1 &
          node -e "(async()=>{for(let n=0;n<40;n++){try{const r=await fetch('http://127.0.0.1:5173/');if(r.ok)return}catch{}await new Promise(r=>setTimeout(r,250))}throw new Error('Vite startup timed out')})().catch(e=>{console.error(e);process.exit(1)})"
          node tests/pi-ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-ui-390-1280
          path: docs/quality/ui/pi-*.png
