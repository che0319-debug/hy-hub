name: Office P0 UI
on:
  pull_request:
    paths:
      - 'src/botOfficeData.js'
      - 'src/components/OfficeDecisions.jsx'
      - 'src/components/OfficeActions.jsx'
      - 'src/components/BotOfficePanels.jsx'
      - 'src/pages/BotOffice.jsx'
      - 'src/pages/bot-office.css'
      - 'tests/office-answers*'
      - 'tests/office-p1*'
      - 'tests/bot-office*'
      - '.github/workflows/office-p0-ui.yml'
permissions:
  contents: read
jobs:
  office-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.51.1 @fontsource/noto-sans-tc@5.3.1
      - run: npx playwright install --with-deps chromium
      - name: Isolated Office answers and old UI regression
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/office-vite.log 2>&1 &
          node -e "(async()=>{for(let n=0;n<40;n++){try{if((await fetch('http://127.0.0.1:5173/')).ok)return}catch{}await new Promise(r=>setTimeout(r,250))}throw new Error('Vite not ready')})().catch(e=>{console.error(e);process.exit(1)})"
          node tests/office-answers-ui.cjs
          node tests/office-p1-ui.cjs
          node tests/bot-office-layout-ui.cjs
          node tests/bot-office-ui.cjs
          node tests/router-ui.cjs
          node tests/pi-ui-smoke.cjs
          node tests/module-registry-ui.cjs
          node tests/review-blockers-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-p0-ui
          path: docs/quality/ui/**/*.png
          retention-days: 14
